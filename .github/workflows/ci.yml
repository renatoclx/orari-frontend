name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # As rotas tipadas (PageProps<"/financeiro">) vêm de arquivos que o Next gera.
      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # A API_URL entra no build (reescrita de /uploads); aqui só precisa existir.
      - name: Build
        run: npm run build
        env:
          API_URL: http://api:3333
